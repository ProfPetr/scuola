<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Glossario di Scienze</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f3f5f7;
    height:100vh;
    overflow:hidden;
}

.container{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
    overflow:hidden;
}

/* MENU */

.sidebar{
    background:white;
    border-right:1px solid #ddd;

    display:flex;
    flex-direction:column;

    height:100vh;
    overflow:hidden;
}

.header{

padding:20px;
font-size:26px;
font-weight:bold;
color:#1565c0;

}

.search{

padding:15px;

}

.search input{

width:100%;
padding:10px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;

}

#list{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-gutter:stable;
}

.term{

padding:14px 18px;
cursor:pointer;
border-bottom:1px solid #eee;
transition:.2s;

}

.term:hover{

background:#E3F2FD;

}

.term.active{

background:#1976D2;
color:white;
font-weight:bold;

}

/* DEFINIZIONE */

.content{
    padding:40px;
    overflow-y:auto;
    overflow-x:hidden;
    height:100vh;
}

h1{

margin-bottom:20px;
color:#1565c0;

}

.definition{

font-size:18px;
line-height:1.7;

}

.placeholder{

font-size:20px;
color:#999;
margin-top:50px;
text-align:center;

}

/* Responsive */

@media(max-width:900px){

.container{

grid-template-columns:1fr;
grid-template-rows:320px auto;

}

.sidebar{

border-right:none;
border-bottom:1px solid #ddd;

}

}

</style>

</head>
<body>

<div class="container">

<div class="sidebar">

<div class="header">
Glossario
</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Cerca un termine...">

</div>

<div id="list"></div>

</div>

<div class="content">

<h1 id="title">Glossario di Scienze</h1>

<div
id="definition"
class="placeholder">

Seleziona un termine dall'elenco.

</div>

</div>

</div>

<script>

const terms={

"Atomo" : "La più piccola parte di un elemento chimico che ne conserva tutte le proprietà chimiche.",
"Nucleo atomico" : "Regione centrale dell’atomo costituita da protoni e neutroni.",
"Nube elettronica" : "Regione dello spazio in cui è più probabile trovare gli elettroni.",
"Protone" : "Particella subatomica con carica positiva (+1).",
"Neutrone" : "Particella subatomica priva di carica elettrica.",
"Elettrone" : "Particella subatomica con carica negativa (−1).",
"Numero atomico (Z)" : "Numero di protoni presenti nel nucleo.",
"Numero di massa (A)" : "Somma di protoni e neutroni.",
"Isotopo" : "Atomi dello stesso elemento con uguale numero di protoni ma diverso numero di neutroni.",
"Ione" : "Atomo o gruppo di atomi con carica elettrica netta.",
"Catione" : "Ione con carica positiva.",
"Anione" : "Ione con carica negativa.",
"Orbitale atomico" : "Regione dello spazio dove la probabilità di trovare un elettrone è massima.",
"Configurazione elettronica" : "Distribuzione degli elettroni negli orbitali di un atomo.",
"Elettroni di valenza" : "Elettroni presenti nel livello energetico più esterno.",
"Principio di Aufbau" : "Gli elettroni occupano prima gli orbitali a energia minore.",
"Principio di esclusione di Pauli" : "Due elettroni nello stesso atomo non possono avere i quattro numeri quantici uguali.",
"Regola di Hund" : "Gli elettroni occupano gli orbitali degeneri singolarmente prima di appaiarsi.",
"Legame chimico" : "Interazione che tiene uniti due o più atomi.",
"Legame covalente" : "Legame ottenuto mediante condivisione di elettroni.",
"Legame ionico" : "Attrazione elettrostatica tra ioni di carica opposta.",
"Legame metallico" : "Legame tra atomi metallici dovuto a elettroni delocalizzati.",
"Struttura di Lewis" : "Rappresentazione dei legami e degli elettroni di valenza.",
"Regola dell’ottetto" : "Gli atomi tendono a completare otto elettroni nel guscio di valenza.",
"Teoria VSEPR" : "Le coppie elettroniche si dispongono il più lontano possibile per minimizzare le repulsioni.",
"Geometria elettronica" : "Disposizione di tutte le coppie elettroniche attorno all’atomo centrale.",
"Geometria molecolare" : "Disposizione nello spazio dei soli atomi della molecola.",
"Numero sterico" : "Somma degli atomi legati all’atomo centrale e delle coppie solitarie.",
"Coppia di legame" : "Coppia di elettroni condivisa tra due atomi.",
"Coppia solitaria" : "Coppia di elettroni non condivisa localizzata su un atomo.",
"Elettronegatività" : "Capacità di un atomo di attrarre gli elettroni di legame.",
"Legame covalente polare" : "Legame tra atomi con diversa elettronegatività.",
"Legame covalente apolare" : "Legame tra atomi con uguale o simile elettronegatività.",
"Momento dipolare" : "Misura della separazione delle cariche in un legame o in una molecola.",
"Molecola polare" : "Molecola con momento dipolare risultante diverso da zero.",
"Molecola apolare" : "Molecola con momento dipolare risultante nullo."


};

const list=document.getElementById("list");
const title=document.getElementById("title");
const definition=document.getElementById("definition");

function draw(filter=""){

list.innerHTML="";

Object.keys(terms)
.sort()
.filter(t=>t.toLowerCase().includes(filter.toLowerCase()))
.forEach(term=>{

const div=document.createElement("div");

div.className="term";

div.textContent=term;

div.onclick=()=>{

document
.querySelectorAll(".term")
.forEach(x=>x.classList.remove("active"));

div.classList.add("active");

title.textContent=term;

definition.className="definition";

definition.innerHTML=terms[term];

}

list.appendChild(div);

});

}

draw();

document
.getElementById("search")
.addEventListener("input",e=>draw(e.target.value));

</script>

</body>
</html>
